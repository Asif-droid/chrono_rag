services:
  neo4j:
    image: neo4j:5-community
    container_name: chrono-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser  -> http://localhost:7474
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/asif1234
    volumes:
      - ./neo4j_data/data:/data
      - ./neo4j_data/logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"asif1234\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    container_name: chrono-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # NEO4J_URI: bolt://localhost:7687
      # NEO4J_USER: neo4j
      # NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # GEMINI_API_KEY: ${GEMINI_API_KEY}
      # LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./app:/app
    env_file:
      - .env
    stdin_open: true
    tty: true
    # Runs once and exits. Re-run with: docker compose run --rm app

